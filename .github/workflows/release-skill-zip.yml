name: Attach research skill to release

# Every MSRBot release carries msrbot-research.zip (the claude.ai upload for
# research/skills/msrbot-research), so one link always serves the newest copy:
#   https://github.com/PrZ3r/MSRBot.io/releases/latest/download/msrbot-research.zip
#
# Automatic: publishing a release (e.g. `gh release create vX.Y.Z …`) triggers
# this workflow, which builds the zip from the release's tagged commit and
# attaches it a few seconds later. Nothing to remember.
#
# Manual: run it with a tag to (re)attach the zip to an existing release.
#
# Requires immutable releases to be OFF for this repo; an immutable release
# rejects assets after publishing. v2.3.0 through v2.4.1 were published while
# it was on, so they can't be changed.
#
# Note: a release created with the workflow GITHUB_TOKEN does not fire the
# `release` event. Releases published from a user account or a GitHub App
# token do.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the zip to (e.g. v2.4.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-skill-zip-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  attach:
    name: Build and attach msrbot-research.zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the release can take assets
        id: check
        run: |
          immutable=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.immutable // false')
          if [ "$immutable" = "true" ]; then
            echo "::warning::Release $TAG is immutable and can't take new assets; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.skip != 'true'
        with:
          ref: ${{ env.TAG }}

      - name: Build zip
        id: build
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ ! -f research/skills/msrbot-research/SKILL.md ]; then
            echo "No research skill at $TAG; nothing to attach."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd research/skills
          zip -r "$RUNNER_TEMP/msrbot-research.zip" msrbot-research -x "*.DS_Store" "*__pycache__*"
          # claude.ai requires the skill folder as the zip's top level.
          unzip -Z1 "$RUNNER_TEMP/msrbot-research.zip" | grep -qx 'msrbot-research/SKILL.md'
          version=$(python3 -c "import json;print(json.load(open('../.claude-plugin/plugin.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        if: steps.check.outputs.skip != 'true' && steps.build.outputs.skip != 'true'
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP/msrbot-research.zip" --clobber --repo "$GITHUB_REPOSITORY"
          {
            echo "### msrbot-research.zip attached to \`$TAG\` (skill ${{ steps.build.outputs.version }})"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/msrbot-research.zip"
          } >> "$GITHUB_STEP_SUMMARY"
