name: Publish release

# Publishes a DRAFT release with msrbot-research.zip (the claude.ai upload for
# research/skills/msrbot-research) attached, so every MSRBot release carries it
# and one link always serves the newest copy:
#   https://github.com/PrZ3r/MSRBot.io/releases/latest/download/msrbot-research.zip
#
# This repo has immutable releases on: once a release is published, nothing
# can be attached to it. So the zip goes onto the draft first, then this
# workflow publishes it.
#
#   1. Draft the release (web UI, or:
#        gh release create vX.Y.Z --draft --target <sha> --title vX.Y.Z --notes-file notes.md)
#   2. Actions -> Publish release -> Run workflow -> tag vX.Y.Z
#        (or: gh workflow run release-skill-zip.yml -f tag=vX.Y.Z)
#
# The zip is built from the draft's target commit.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the DRAFT release to attach the zip to and publish (e.g. v2.4.1)"
        required: true
      make_latest:
        description: "Mark as the repo's Latest release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Attach msrbot-research.zip and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the draft release
        id: draft
        run: |
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                  --jq ".[] | select(.tag_name == \"$TAG\") | {id, draft, target_commitish}" | head -1)
          if [ -z "$rel" ]; then
            echo "::error::No release with tag $TAG. Create it as a draft first."; exit 1
          fi
          if [ "$(jq -r .draft <<<"$rel")" != "true" ]; then
            echo "::error::Release $TAG is already published. Immutable releases can't take new assets; cut a new (patch) release as a draft."; exit 1
          fi
          echo "id=$(jq -r .id <<<"$rel")" >> "$GITHUB_OUTPUT"
          echo "target=$(jq -r .target_commitish <<<"$rel")" >> "$GITHUB_OUTPUT"
          echo "Draft $TAG targets $(jq -r .target_commitish <<<"$rel")"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.draft.outputs.target }}

      - name: Build zip
        id: build
        run: |
          test -f research/skills/msrbot-research/SKILL.md || { echo "::error::No research skill at ${{ steps.draft.outputs.target }}"; exit 1; }
          cd research/skills
          zip -r "$RUNNER_TEMP/msrbot-research.zip" msrbot-research -x "*.DS_Store" "*__pycache__*"
          # claude.ai requires the skill folder as the zip's top level.
          unzip -Z1 "$RUNNER_TEMP/msrbot-research.zip" | grep -qx 'msrbot-research/SKILL.md'
          version=$(python3 -c "import json;print(json.load(open('../.claude-plugin/plugin.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Attach to draft and publish
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP/msrbot-research.zip" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest=${{ inputs.make_latest }} --repo "$GITHUB_REPOSITORY"
          {
            echo "### Published \`$TAG\` with msrbot-research.zip (skill ${{ steps.build.outputs.version }})"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
