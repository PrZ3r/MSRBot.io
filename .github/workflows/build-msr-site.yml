name: Build MSRBot.io Site and Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write 

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    name: Build MSR
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Mint PrZ3 Unit token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Depth-1 is enough (the build only needs HEAD's SHA). fetch-depth: 0
      # fetched every branch's full history — incl. ~6.5 GB of gh-pages — and
      # took ~8 min per run (#1265).
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Validate registries
        run: npm run validate

      - name: Canonicalize registries (sanity check)
        run: |
          npm run canonicalize
          if git diff --quiet -- src/main/data; then
            echo "No canonicalization changes."
          else
            echo "::warning::Canonicalize produced local changes during site build (not auto-committing on main build workflow)."
            git status --short src/main/data || true
          fi

      - name: Build site
        env:
          GH_PAGES_BUILD: true
        run: npm run build

      # Single-commit gh-pages: publishes the site root as one parentless
      # commit (pr/ previews, CNAME, .nojekyll kept); only changed files are
      # uploaded; --force-with-lease + retry keeps concurrent deploys safe (#1265).
      - name: Deploy to gh-pages
        env:
          GH_PAGES_REPO_URL: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git
          GH_PAGES_MESSAGE: 'deploy: ${{ github.sha }} (PrZ3 Unit)'
        run: bash src/main/scripts/ci/publishGhPages.sh site build
