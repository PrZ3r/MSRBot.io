name: Build MSRBot.io Site and Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write 

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    name: Build MSR
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Mint PrZ3 Unit token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Validate registries
        run: npm run validate

      - name: Canonicalize registries (sanity check)
        run: |
          npm run canonicalize
          if git diff --quiet -- src/main/data; then
            echo "No canonicalization changes."
          else
            echo "::warning::Canonicalize produced local changes during site build (not auto-committing on main build workflow)."
            git status --short src/main/data || true
          fi

      - name: Build site
        env:
          GH_PAGES_BUILD: true
        run: npm run build

      - name: Generate API stats
        run: |
          mkdir -p build/api
          node src/main/scripts/utils/buildStats.js
          cp tools/apiViewer.html build/api/viewer.html

      - name: Checkout gh-pages (for selective cleanup)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ghp
          token: ${{ steps.app-token.outputs.token }}

      - name: Clean gh-pages except /pr, CNAME, and .nojekyll
        working-directory: ghp
        run: |
          set -euo pipefail
          echo "Preparing selective cleanup in $(pwd)"
          shopt -s dotglob
          # Safety checks
          test -d .git || (echo "Not a git repo; aborting" && exit 1)

          # Remove everything except keepers
          for entry in * .[^.]*; do
            case "$entry" in
              .|..|.git|.gitignore|.gitattributes|.github) continue ;;
              pr|CNAME|.nojekyll) continue ;;
              *) rm -rf "$entry" ;;
            esac
          done

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit on gh-pages (cleanup not needed)."
          else
            git config user.name "PrZ3 Unit"
            git config user.email "prz3-unit[bot]@users.noreply.github.com"
            git commit -m "chore: selective cleanup on gh-pages (preserve /pr, CNAME, .nojekyll)"
            git push origin HEAD:gh-pages
            echo "✅ Selective cleanup committed."
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          publish_dir: ./build
          keep_files: true
          user_name: 'PrZ3 Unit'
          user_email: 'prz3-unit[bot]@users.noreply.github.com'
          commit_message: "deploy: ${{ github.sha }} (PrZ3 Unit)"
          cname: msrbot.io
          # optional hardening:
          # publish_branch: gh-pages
          # force_orphan: true
