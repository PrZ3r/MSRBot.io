name: PR Preview Sweeper
on:
  schedule:
    - cron: "0 9 * * 0"  # Sundays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Mint PrZ3 Unit token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          token: ${{ steps.app-token.outputs.token }}

      - name: Remove previews for closed PRs
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          # list pr directories
          for d in pr/*/ ; do
            [ -d "$d" ] || continue
            num="${d%/}"; num="${num#pr/}"
            state=$(gh pr view "$num" --repo "$REPO" --json state -q .state || echo "MISSING")
            if [ "$state" != "OPEN" ]; then
              echo "Removing preview for closed PR #$num"
              git rm -r "$d"
            fi
          done
          git config user.name "PrZ3 Unit"
          git config user.email "prz3-unit[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to sweep."
            exit 0
          fi
          git commit -m "Sweep: remove previews for closed PRs"
          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              echo "✅ Sweep pushed (attempt ${attempt})"
              exit 0
            fi
            echo "⚠️ Push failed (attempt ${attempt}/3), rebasing on latest gh-pages…"
            git pull --rebase origin gh-pages
          done
          echo "::error::Failed to push sweep after 3 attempts"
          exit 1
