name: PR Preview Sweeper
on:
  schedule:
    - cron: "0 9 * * 0"  # Sundays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Mint PrZ3 Unit token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          sparse-checkout: src/main/scripts/ci

      - name: Remove previews for closed PRs
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_PAGES_REPO_URL: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git
          GH_PAGES_MESSAGE: 'Sweep: remove previews for closed PRs'
        run: |
          set -euo pipefail
          # pr/<n> directories on gh-pages, read from its tree (no checkout).
          nums="$(gh api "repos/$REPO/contents/pr?ref=gh-pages" --jq '.[] | select(.type=="dir") | .name' 2>/dev/null || true)"
          closed=()
          for num in $nums; do
            state=$(gh pr view "$num" --repo "$REPO" --json state -q .state || echo "MISSING")
            if [ "$state" != "OPEN" ]; then
              echo "Removing preview for closed PR #$num"
              closed+=("$num")
            fi
          done
          if [ "${#closed[@]}" -eq 0 ]; then echo "Nothing to sweep."; exit 0; fi
          bash src/main/scripts/ci/publishGhPages.sh remove-previews "${closed[@]}"
