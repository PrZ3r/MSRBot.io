name: PR Build Preview (MSRBot.io site)

# Runs the checks for EVERY PR, forks included: checkout, validate, tests and a
# full site build need no secrets. Only the privileged steps — minting the app
# token, publishing the preview to gh-pages, commenting the URL — are gated to
# same-repo PRs, because GitHub gives fork PRs a read-only token and no secrets
# (that is not something "approve and run" changes on a public repo).
# A fork PR therefore gets pass/fail on the same checks, just no preview URL.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Manual PRs that touch site or templates
      - "src/site/**"
      - "src/main/config/**"
      - "src/main/lib/**"
      - "src/main/templates/**"
      - "tools/**" 
      - "package.json"
      - "package-lock.json"
      # Extract PRs (bot): include because they change the dataset used by the site
      - "src/main/data/**"
      # MSI/MRI PRs: include to trigger previews for report changes
      - "src/main/reports/**"

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pages-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Build the preview only once the PR's MSI/MRI reports are current: wait for
  # "Build MSI + MRI (PR)" on this same commit. If it pushed a report commit,
  # stand down — the preview for that newer commit is the one that matters.
  # PRs that don't trigger a rebuild (site/template-only) proceed right away.
  reports-gate:
    if: "!startsWith(github.head_ref, 'gh-pages')"

    runs-on: ubuntu-latest
    outputs:
      superseded: ${{ steps.wait.outputs.superseded }}
    steps:
      - name: Wait for MSI/MRI rebuild on this commit
        id: wait
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const start = Date.now();
            const APPEAR_MS = 90 * 1000;       // rebuild run should exist by now if it will run
            const TIMEOUT_MS = 25 * 60 * 1000; // then give it up to ~25 min
            core.setOutput('superseded', 'false');
            for (;;) {
              let run = null;
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: 'build-reports-pr.yml', head_sha: sha, per_page: 5
                });
                run = data.workflow_runs[0] || null;
              } catch (e) {
                core.info(`Could not list MSI/MRI runs (${e.status || e.message}); building now.`);
                return;
              }
              if (run && run.status === 'completed') {
                core.info(`MSI/MRI rebuild finished (${run.conclusion}): ${run.html_url}`);
                break;
              }
              if (!run && Date.now() - start > APPEAR_MS) {
                core.info('No MSI/MRI rebuild for this commit; building now.');
                return;
              }
              if (Date.now() - start > TIMEOUT_MS) {
                core.warning('Timed out waiting for the MSI/MRI rebuild; building anyway.');
                return;
              }
              await sleep(20 * 1000);
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.payload.pull_request.number });
            if (pr.head.sha !== sha) {
              core.info(`Branch moved to ${pr.head.sha.slice(0, 7)} (report commit); that commit's preview will build.`);
              core.setOutput('superseded', 'true');
            }

  build:
    name: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'Build + deploy preview' || 'Checks (fork PR — no preview deploy)' }}
    needs: reports-gate
    if: needs.reports-gate.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    env:
      KEYWORD_VALIDATION_MODE: warn
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # Fork PRs get no secrets, so this is a no-op there and every later step
      # falls back to the read-only github.token.
      - name: Mint PrZ3 Unit token
        id: app-token
        if: env.SAME_REPO == 'true' && github.actor != 'dependabot[bot]'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # No `ref:` — check out the PR's merge commit, which also means a fork's
      # head (which isn't a branch in this repo) works unchanged.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      - name: Canonicalize data (sanity)
        run: npm run canonicalize

      - name: Validate dataset
        run: npm run validate

      - name: Unit tests
        run: npm test

      - name: Build site preview
        run: npm run build   # produces ./build (includes build/api/stats.json)

      - name: Verify build output exists
        run: |
          if [ ! -d build ]; then
            echo "::error::No build/ output directory found after 'npm run build'.";
            echo "Contents of repo root:";
            ls -la;
            echo "\nLikely build output directories in top 2 levels:";
            find . -maxdepth 2 -type d -name "*dist*" -o -name "*build*" -o -name "*public*";
            exit 1;
          fi

      - name: Deploy PR preview to gh-pages/pr/<PR#>
        if: env.SAME_REPO == 'true'
        env:
          GH_PAGES_REPO_URL: https://x-access-token:${{ steps.app-token.outputs.token || github.token }}@github.com/${{ github.repository }}.git
          GH_PAGES_MESSAGE: 'deploy preview for PR #${{ github.event.pull_request.number }} (PrZ3 Unit)'
        run: bash src/main/scripts/ci/publishGhPages.sh preview "${{ github.event.pull_request.number }}" build

      - name: Note that a fork PR gets no preview
        if: env.SAME_REPO != 'true'
        run: |
          {
            echo "### Checks ran; no preview deployed"
            echo ""
            echo "This PR is from a fork, so GitHub withholds secrets and gives the run a read-only token — the preview can't be published to \`gh-pages\`."
            echo "Everything else (validate, tests, full site build) ran above, so the checks are meaningful."
            echo "A maintainer can produce a preview by pushing the same commits to a branch in this repo."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: env.SAME_REPO == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          header: msr-preview
          number: ${{ github.event.pull_request.number }}
          message: |
            # Review link
            [MSRBot.io Build Preview](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr/${{ github.event.pull_request.number }}/)
            _This link updates on new commits to this PR._ 
