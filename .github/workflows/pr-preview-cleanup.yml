name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  cleanup:
    # Only for PRs from this repo (matches your preview guard)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Mint PrZ3 Unit token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Needs the publish script from the default branch, not gh-pages.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: src/main/scripts/ci

      - name: Remove pr/<PR#> from gh-pages
        env:
          GH_PAGES_REPO_URL: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git
          GH_PAGES_MESSAGE: 'Cleanup preview for PR #${{ github.event.number }}'
        run: bash src/main/scripts/ci/publishGhPages.sh remove-previews "${{ github.event.number }}"

      - name: Update PR comment to mark preview removed
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: msr-preview
          message: |
            Preview removed (PR closed):
            [MSRBot.io Build Preview](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr/${{ github.event.number }}/)

            _This URL should now return 404 (directory deleted)._